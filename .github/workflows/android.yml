name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Configuration & Keystore
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER || 'https://aroma-party-server.onrender.com' }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "Decoding release keystore..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aroma-release.jks
          {
            echo "storeFile=aroma-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
        else
          echo "No release keystore found, will build debuggable prod APK"
          echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Android APK
      run: |
        if [ "$HAS_KEYSTORE" = "true" ]; then
          ./gradlew assembleProdRelease -Pbitchord.bundleWear=false
        else
          ./gradlew assembleProdDebug -Pbitchord.bundleWear=false
        fi

    - name: Find and Prepare APK for Artifact
      run: |
        mkdir -p release-apk
        find app/build/outputs/apk/ -name "*.apk" -exec cp {} release-apk/Aroma-Music.apk \;
        ls -la release-apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aroma-Music-Android-APK
        path: release-apk/Aroma-Music.apk

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: app-latest
        name: "Aroma Music Android App (Latest APK)"
        body: |
          Official Aroma Music Android App (Latest Build).
          
          Features:
          - Official Aroma glowing violet theme and launcher icon
          - High-fidelity streaming with background audio and offline caching
          - Native YouTube Music playback without bot detection
          - Automatic sync with Listen Together and Aroma Web
        draft: false
        prerelease: false
        files: release-apk/Aroma-Music.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Wear OS APK Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Aroma-Wear-OS-APK
        path: wearos/build/outputs/apk/**/*.apk
