services:
  # 1. Aroma Listen Together Go WebSocket Party Server
  - type: web
    name: aroma-party-server
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 9000
      - key: JAM_TRUST_PROXY
        value: "true"
      - key: JAM_ALLOWED_ORIGINS
        value: "*"

  # 2. Aroma Web Music Player Frontend
  - type: web
    name: aroma-web-player
    runtime: static
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile=false && pnpm --filter @aroma/app build
    staticPublishPath: ./app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_PARTY_SERVER_URL
        sync: false
