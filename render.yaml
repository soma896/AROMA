services:
  # 1. Aroma Listen Together Go WebSocket Party Server
  - type: web
    name: aroma-party-server
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 9000
      - key: JAM_TRUST_PROXY
        value: "true"
      - key: JAM_ALLOWED_ORIGINS
        value: "*"

  # 2. Aroma Web Music Player Frontend
  - type: static
    name: aroma-web-player
    plan: free
    region: oregon
    buildCommand: cd web && pnpm install --frozen-lockfile=false && pnpm --filter @aroma/app build
    staticPublishPath: ./web/app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_PARTY_SERVER_URL
        fromService:
          type: web
          name: aroma-party-server
          property: host
